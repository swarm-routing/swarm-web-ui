name: Licence

# The whole repository is MIT OR GPL-2.0-only (LICENSING.md). The input cannot
# name the root, so name each top-level source directory in dual-roots as it is
# added; until then every file still needs its SPDX line.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:  # the merge queue runs the required checks on each group (swarm-routing/.github#130)

permissions:
  contents: read

jobs:
  headers:
    uses: swarm-routing/.github/.github/workflows/reusable-licence-check.yml@9a1ce0ffeda6916186f97b0c5a7678bcbc7578ad # main@2026-11-24
    with:
      dual-roots: ''
      core-roots: ''
